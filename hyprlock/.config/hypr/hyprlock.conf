#* ~~~~~~~~~~ HYPRLOCK CONFIG ~~~~~~~~~~ *#

# ~~~~~~~~~~ GENERAL ~~~~~~~~~~ #

general {
    disable_loading_bar = true
    hide_cursor = true
}

# ~~~~~~~~~~ BACKGROUNDS ~~~~~~~~~~ #

background {
    monitor = HDMI-A-1
    path = ~/Imágenes/Wallpapers/wallpaper3.png
    blur_passes = 2
}

background {
    monitor = DP-1
    blur_passes = 2
    color = rgb(26, 27, 38)
}

# ~~~~~~~~~~ TIME ~~~~~~~~~~ #

label {
    monitor = DP-1
    text = cmd[update:30000] echo "$(date +"%R")"
    color = rgb(154, 165, 206)
    font_size = 450
    font_family = Figtree
    position = 0, 0
    halign = center
    valign = center
}

# ~~~~~~~~~~ INPUT ~~~~~~~~~~ #

label {
    monitor = HDMI-A-1
    text = Oh, hi!
    color = rgb(154, 165, 206)
    font_size = 40
    font_family = Figtree
    position = 0, 40
    halign = center
    valign = center
}

input-field {
    monitor = HDMI-A-1
    size = 300, 60
    outline_thickness = 4
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgb(26, 27, 38)
    inner_color = rgb(26, 27, 38)
    font_color = rgb(154, 165, 206)
    fade_on_empty = false
    placeholder_text = Log in
    hide_input = false
    check_color = $accent
    fail_color = $red
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    capslock_color = $yellow
    position = 0, -40
    halign = center
    valign = center
}
